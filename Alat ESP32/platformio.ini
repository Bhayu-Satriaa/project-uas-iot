; PlatformIO - Alat penerjemah ESP32 (versi sederhana: satu tombol, tanpa musik)
;
; Catatan: platform dipatok 6.8.1 (Arduino core 2.x) agar driver I2S lama
; (driver/i2s.h) tetap tersedia untuk mikrofon.

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

build_flags =
    -DCORE_DEBUG_LEVEL=0
